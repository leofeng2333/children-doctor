<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <title>口腔-面容变化 · 输入信息</title>
    <!-- 启动时检测版本：fetch version.json 比对上次部署版本，变了就 force reload -->
    <script>
      ;(function () {
        try {
          fetch('./version.json?_=' + Date.now(), { cache: 'no-store' })
            .then(function (r) {
              return r.json()
            })
            .then(function (data) {
              var last = sessionStorage.getItem('__h5_version')
              if (last && last !== data.version) {
                sessionStorage.setItem('__h5_version', data.version)
                location.reload(true)
              } else {
                sessionStorage.setItem('__h5_version', data.version)
              }
            })
            .catch(function () {})
        } catch (e) {}
      })()
    </script>
    <link rel="stylesheet" href="./base.css" />
    <link rel="stylesheet" href="./input-first.css" />
  </head>
  <body>
    <div class="page">
      <div class="bg-deco d1"></div>
      <div class="bg-deco d2"></div>
      <div class="bg-deco d3"></div>

      <div class="content">
        <div class="header-illu" aria-hidden="true">
          <span class="header-illu-icon"></span>
        </div>

        <h1 class="title">
          填写手机号<br />
          可在公众号中永久查看报告
        </h1>

        <form class="form" id="form">
          <div class="field-group">
            <label class="field-label" for="name">我该怎么称呼你呢？</label>
            <div class="field">
              <input
                id="name"
                type="text"
                maxlength="40"
                placeholder="输入姓名"
                autocomplete="name"
              />
            </div>
          </div>

          <div class="field-group">
            <label class="field-label" for="phone">你的联系方式？</label>
            <div class="field">
              <input
                id="phone"
                type="tel"
                inputmode="numeric"
                maxlength="11"
                placeholder="输入手机号"
                autocomplete="tel"
              />
            </div>
          </div>

          <button type="submit" class="view-photos">查 看 报 告</button>

          <p class="tips">* 请记住所填写的手机号，方便下次查看电子诊断结果时使用哦！</p>
        </form>
      </div>

      <div class="footer">
        <div class="logo">
          <img class="logo-left" src="./images/logo-left.png" alt="" />
          <img class="logo-right" src="./images/logo-right.png" alt="" />
        </div>
      </div>
    </div>

    <script type="module" src="./input-first/main.js"></script>
  </body>
</html>
