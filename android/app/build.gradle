apply plugin: 'com.android.application'

import groovy.json.JsonSlurper

/**
 * 读取根目录 package.json 的 version 字段并拆成 versionCode + versionName。
 * 每次发版只需修改 package.json 的 "version"。
 *
 * versionCode 规则（必须是单调递增的整数，Android 拒绝降级安装）：
 *   major * 1000000 + minor * 1000 + patch
 *   "1.0.0"   -> 1000000
 *   "1.2.3"   -> 1002003
 *   "2.0.0"   -> 2000000
 * 也支持带 -beta.x / -rc.x 等预发布后缀，仅取前三位纯数字段。
 */
def pkg = new JsonSlurper().parse(file("${rootProject.projectDir}/../package.json"))
def versionParts = pkg.version.toString().split('-')[0].split('\\.')
def major = versionParts.length > 0 ? versionParts[0].toInteger() : 0
def minor = versionParts.length > 1 ? versionParts[1].toInteger() : 0
def patch = versionParts.length > 2 ? versionParts[2].toInteger() : 0
def computedVersionCode = major * 1000000 + minor * 1000 + patch

android {
    namespace = "com.children.doctor"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.children.doctor"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode computedVersionCode
        versionName pkg.version.toString()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
        // 显式声明 ABI，避免 AGP 用“默认全集”导致产物里漏掉手机对应的 ABI（arm64-v8a）。
        // 包含 arm64-v8a：覆盖现代手机；包含 armeabi-v7a：覆盖 32 位旧机。
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }
    signingConfigs {
        defaultSign {
            // SWY-3566/3568 视微元系统签名 keystore
            storeFile file("./yf356x_android11_system.jks")
            storePassword "youngfeel"
            keyAlias "platform"
            keyPassword "youngfeel"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.defaultSign
        }
        debug {
            signingConfig signingConfigs.defaultSign
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    // HiTi USB 照片打印机 SDK (aar)。fileTree 不收 *.aar, 必须显式列。
    implementation fileTree(include: ['*.aar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.camera:camera-core:1.4.1"
    implementation "androidx.camera:camera-camera2:1.4.1"
    implementation "androidx.camera:camera-lifecycle:1.4.1"
    implementation "androidx.camera:camera-view:1.4.1"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

/**
 * 给所有 APK 输出文件名加上 versionName + versionCode。
 *   app-debug.apk       -> app-debug-1.0.0-1000000.apk
 *   app-release.apk     -> app-release-1.0.0-1000000.apk
 */
android.applicationVariants.all { variant ->
    variant.outputs.all {
        def vName = variant.versionName ?: 'unknown'
        def vCode = variant.versionCode ?: 0
        outputFileName = "${project.name}-${variant.baseName}-${vName}-${vCode}.apk"
    }
}
