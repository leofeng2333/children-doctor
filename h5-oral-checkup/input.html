<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <title>口腔-面容变化 · 输入信息</title>
    <!-- 启动时检测版本：fetch version.json 比对上次部署版本，变了就 force reload -->
    <script>
      ;(function () {
        try {
          fetch('./version.json?_=' + Date.now(), { cache: 'no-store' })
            .then(function (r) {
              return r.json()
            })
            .then(function (data) {
              var last = sessionStorage.getItem('__h5_version')
              if (last && last !== data.version) {
                sessionStorage.setItem('__h5_version', data.version)
                location.reload(true)
              } else {
                sessionStorage.setItem('__h5_version', data.version)
              }
            })
            .catch(function () {})
        } catch (e) {}
      })()
    </script>
    <link rel="stylesheet" href="./base.css" />
    <link rel="stylesheet" href="./input.css" />
  </head>
  <body>
    <div class="page">
      <div class="bg-deco d1"></div>
      <div class="bg-deco d2"></div>
      <div class="bg-deco d3"></div>

      <div class="content">
        <div class="header-illu" aria-hidden="true">
          <span class="header-illu-icon"></span>
        </div>

        <h1 class="title">
          请输入您在拍摄时<br />
          预留的手机号
        </h1>

        <form class="form" id="form">
          <div class="field">
            <input
              id="phone"
              type="tel"
              inputmode="numeric"
              maxlength="11"
              placeholder="输入手机号"
              autocomplete="tel"
            />
          </div>

          <div class="row-2">
            <button type="button" id="get-code" class="get-btn">获取验证码</button>
            <div class="code-field">
              <input
                id="code"
                type="text"
                inputmode="numeric"
                maxlength="6"
                size="1"
                placeholder="输入验证码"
                autocomplete="one-time-code"
              />
            </div>
          </div>

          <div class="divider"></div>

          <button type="submit" class="view-photos">查 看 照 片</button>
        </form>
      </div>

      <div class="footer">
        <div class="logo">
          <img class="logo-left" src="./images/logo-left.png" alt="" />
          <img class="logo-right" src="./images/logo-right.png" alt="" />
        </div>
      </div>
    </div>

    <script type="module" src="./input/main.js"></script>
  </body>
</html>
