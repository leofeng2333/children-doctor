<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <title>口腔-面容变化 · 结果</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
      }

      body {
        background: #f2684e;
        font-family:
          'Inter',
          -apple-system,
          BlinkMacSystemFont,
          'PingFang SC',
          'Microsoft YaHei',
          sans-serif;
        min-height: 100dvh;
        overflow-x: hidden;
        color: #ffffff;
      }

      :root {
        --page-w: 807;
        --unit: calc(100vw / var(--page-w));
      }

      .page {
        position: relative;
        width: 100vw;
        min-height: 100dvh;
        padding-top: max(env(safe-area-inset-top), 0px);
        padding-bottom: calc(env(safe-area-inset-bottom) + 6vw);
        overflow: hidden;
      }

      /* 3 个粉色块装饰（与 input.html 一致） */
      .bg-deco {
        position: absolute;
        pointer-events: none;
        background: #f2a4a2;
        border-radius: 50%;
        z-index: 0;
      }

      .bg-deco.d1 {
        top: calc(-3.96 * var(--unit));
        left: calc(45.23 * var(--unit));
        width: calc(66.6 * var(--unit));
        height: calc(71.25 * var(--unit));
        border-radius: 50% 50% 45% 55% / 60% 40% 60% 40%;
      }

      .bg-deco.d2 {
        top: calc(153.41 * var(--unit));
        left: calc(-32.42 * var(--unit));
        width: calc(114.72 * var(--unit));
        height: calc(120.5 * var(--unit));
        border-radius: 60% 40% 55% 45% / 50% 50% 50% 50%;
      }

      .bg-deco.d3 {
        top: calc(296.65 * var(--unit));
        left: calc(-1.74 * var(--unit));
        width: calc(145.57 * var(--unit));
        height: calc(144.7 * var(--unit));
        border-radius: 40% 60% 50% 50% / 50% 50% 60% 40%;
      }

      .content {
        position: relative;
        z-index: 1;
        padding: 0 7.68vw;
      }

      /* 标题1: 改正后... */
      .title-after {
        font-size: 5.95vw;
        font-weight: 700;
        line-height: 1.35;
        color: #ffffff;
        width: 60.47vw;
        text-align: left;
        margin-top: 20.34vw;
        margin-bottom: 15vw;
      }

      /* 卡片1: 改正后的样子（Group 16）*/
      .card {
        position: relative;
        width: 87.49vw;
        margin: 0 auto;
        height: 115.71vw;
      }

      .card .card-base {
        position: absolute;
        top: 15.61vw;
        left: 0;
        width: 71.35vw;
        height: 90.08vw;
        background: #eefaff;
        border-radius: 4.46vw;
        box-shadow: 0 1.8vw 5.4vw rgba(0, 0, 0, 0.08);
        overflow: hidden;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding-top: 3.6vw;
      }

      .card .card-img-wrap {
        width: 64.54vw;
        height: 81.47vw;
        border-radius: 2.23vw;
        background: #e9e9e9;
        overflow: hidden;
      }

      .card .card-img {
        width: 100%;
        height: 100%;
        background: #e9e9e9 url('../../dist/assets/html-icon.png') no-repeat;
        background-size: 300% 200%;
        transform: scaleX(-1);
      }

      /* 中上 = 😊 笑脸头像 */
      .card1 .card-img {
        background-position: 50% 0%;
      }

      /* 中下 = 😟 担心头像 */
      .card2 .card-img {
        /* background-position: 50% 100%; */
        background-color: #f7a89b;
      }

      .card .sticker {
        position: absolute;
        top: -5vw;
        right: 0;
        width: 28.94vw;
        height: 26.61vw;
        background-image: url('../../dist/assets/html-icon.png');
        background-repeat: no-repeat;
        background-size: 720% 400%;
        background-position: 80% 10%;
        transform: scaleX(-1) rotate(0deg);
      }

      .card1 {
        transform: translateX(-3vw) rotate(4deg);
        margin-right: 2vw;
      }

      .card1 .card-base {
        left: auto;
        right: 0;
      }

      .card2 .sticker {
        background-position: 38% 56%;
      }

      /* 右上 = ⚠️ 警告三角 */
      .card2 .sticker {
        left: 0vw;
      }

      .card .sticker-text {
        position: absolute;
        top: 1vw;
        right: 1vw;
        font-size: 3.2vw;
        font-weight: 700;
        color: #000;
        background: rgba(255, 255, 255, 0.9);
        padding: 0.5vw 1.5vw;
        border-radius: 1vw;
        z-index: 2;
      }

      /* 标题2: 啊哦... */
      .title-warning {
        font-size: 5.95vw;
        font-weight: 700;
        line-height: 1.35;
        color: #ffffff;
        width: 67.66vw;
        text-align: right;
        margin-left: auto;
        margin-top: 15vw;
        margin-bottom: 15vw;
      }

      /* 卡片2: 当前的样子 */
      .card2 {
        transform: rotate(-4deg);
      }

      .card2 .card-base {
        background: #eefaff;
      }

      /* 描述文字 */
      .description {
        font-size: 2.48vw;
        font-weight: 400;
        line-height: 2.5;
        color: #000000;
        width: 72.74vw;
        margin: 60vw auto 0;
        background: #ffffff;
        border-radius: 4.96vw;
        padding: 4vw 4vw;
        min-height: 50vw;
        position: relative;
      }

      .description-icon {
        position: absolute;
        top: -18vw;
        left: 50%;
        transform: translateX(-50%);
        width: 27vw;
        height: 25vw;
        background: url('../../dist/assets/html-icon.png') no-repeat;
        background-size: 720% 400%;
        background-position: 80% 45%;
      }

      /* 底部 */
      .footer {
        margin-top: 8vw;
        text-align: center;
      }

      .logo {
        display: inline-block;
        font-size: 3.97vw;
        font-weight: 700;
        line-height: 1;
        color: #000000;
        background: #d9d9d9;
        padding: 2.2vw 4vw;
        border-radius: 2.2vw;
        margin-bottom: 2.5vw;
      }

      .save-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 84.51vw;
        height: 9.79vw;
        margin: 0 auto;
        background: #ffffff;
        color: #000000;
        border: none;
        border-radius: 4.96vw;
        font-size: 2.98vw;
        font-weight: 700;
        letter-spacing: 0.3vw;
        cursor: pointer;
      }

      .save-btn:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="bg-deco d1"></div>
      <div class="bg-deco d2"></div>
      <div class="bg-deco d3"></div>

      <div class="content">
        <h2 class="title-warning">
          啊哦，你有××不良习惯，<br />
          不改正可能会有<br />
          ××面型发育问题哦！
        </h2>

        <div class="card card2">
          <div class="card-base">
            <div class="card-img-wrap">
              <div class="card-img"></div>
            </div>
          </div>
          <div class="sticker"></div>
        </div>

        <h1 class="title-after">
          改正不良习惯后，<br />
          16岁时孩子将长这样！
        </h1>

        <div class="card card1">
          <div class="card-base">
            <div class="card-img-wrap">
              <div class="card-img"></div>
            </div>
          </div>
          <div class="sticker"></div>
        </div>

        <div class="description">
          <div class="description-icon"></div>
          测试内容测试内容测试内容测试内容测试内容测试内容测试内容测试内容测试内容测试内容测试内容测试内容测试内容测试内容测试内容测试内容测试内容测试内容测试内容测试内容测试内容测试内容测试内容测试内容测试内容测试内容测试内容测试内容测试内容测试内容测试内容测试内容测试内容测试内容测试内容测试内容测试内容测试内容测试内容测试内容测试内容测试内容测试内容测试内容测试内容测试内容测试内容测试内容测试内容测试内容测试内容测试内容测试内容测试内容测试内容测试内容测试内容测试内容
        </div>

        <div class="footer">
          <div class="logo">logo</div>
          <button class="save-btn" onclick="handleSave()">长 按 保 存 到 手 机</button>
        </div>
      </div>
    </div>

    <script>
      function handleSave() {
        // 提示用户长按保存（移动端系统会弹出保存图片）
        const msg = document.createElement('div')
        msg.textContent = '请长按照片保存'
        msg.style.cssText =
          'position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.8);color:#fff;padding:3vw 6vw;border-radius:2vw;font-size:3.5vw;z-index:9999;'
        document.body.appendChild(msg)
        setTimeout(() => msg.remove(), 1800)
      }

      // 从 input.html 校验接口接收到的数据
      // input.html 写入 sessionStorage('faceResult:verifyData')
      // 此处读取并暴露到 window.__verifyData, 供后续字段填充使用
      ;(function loadVerifyData() {
        let raw = null
        try {
          raw = sessionStorage.getItem('faceResult:verifyData')
        } catch (err) {
          console.warn('[face-result] sessionStorage 读取失败', err)
        }
        if (!raw) {
          console.log('[face-result] 没有来自 input.html 的校验数据')
          return
        }
        try {
          window.__verifyData = JSON.parse(raw)
          console.log('[face-result] 已加载校验数据', window.__verifyData)
        } catch (err) {
          console.warn('[face-result] 校验数据 JSON 解析失败', err, raw)
        }
      })()
    </script>
  </body>
</html>
