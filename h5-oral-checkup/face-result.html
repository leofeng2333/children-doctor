<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <!-- vite 构建会自动给引用的 JS/CSS 加 content-hash；
         HTML 本身被浏览器强缓存，业务代码变了文件名就变，浏览器自然拉到新版本 -->
    <title>口腔-面容变化 · 结果</title>
    <!-- 启动时检测版本：fetch version.json 比对上次部署版本，变了就 force reload -->
    <script>
      ;(function () {
        try {
          fetch('./version.json?_=' + Date.now(), { cache: 'no-store' })
            .then(function (r) {
              return r.json()
            })
            .then(function (data) {
              var last = sessionStorage.getItem('__h5_version')
              if (last && last !== data.version) {
                sessionStorage.setItem('__h5_version', data.version)
                location.reload(true)
              } else {
                sessionStorage.setItem('__h5_version', data.version)
              }
            })
            .catch(function () {})
        } catch (e) {}
      })()
    </script>
    <link rel="stylesheet" href="./base.css" />
    <link rel="stylesheet" href="./face-result.css" />
  </head>
  <body>
    <div class="page">
      <div class="bg-deco d1"></div>
      <div class="bg-deco d2"></div>
      <div class="bg-deco d3"></div>

      <div class="content">
        <h2 class="title-warning">
          啊哦，<br />
          颌面发育似乎不太妙！
        </h2>

        <div class="card card2">
          <div class="card-base">
            <div class="card-img-wrap">
              <img class="card-img" id="bad-img" alt="" />
            </div>
          </div>
          <div class="sticker"></div>
        </div>

        <h1 class="title-after" id="title-after"></h1>

        <div class="card card1">
          <div class="card-base">
            <div class="card-img-wrap">
              <img class="card-img" id="good-img" alt="" />
            </div>
          </div>
          <div class="sticker"></div>
        </div>

        <div class="description">
          <div class="description-icon"></div>
          <div id="description-body">
            <span id="desc-title"></span><span id="desc-opening"></span>
            <div id="desc-body"></div>
            <p id="desc-care"></p>
            <p id="desc-habit"></p>
          </div>
        </div>

        <div class="footer">
          <button class="save-btn" id="save-btn">保 存 到 手 机</button>
          <div class="logo">
            <img class="logo-left" src="./images/logo-left.png" alt="" />
            <img class="logo-right" src="./images/logo-right.png" alt="" />
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="./face-result/main.js"></script>
  </body>
</html>
