<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <title>口腔-面容变化 · 输入信息</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
      }

      body {
        background: #f2684e;
        font-family:
          'Inter',
          -apple-system,
          BlinkMacSystemFont,
          'PingFang SC',
          'Microsoft YaHei',
          sans-serif;
        min-height: 100dvh;
        overflow-x: hidden;
        color: #ffffff;
      }

      /* 设计稿基准宽 807px，1 vw ≈ 1/100 of 视口宽, 直接用 807→100vw 反推 */
      :root {
        --page-w: 807;
        --unit: calc(100vw / var(--page-w));
      }

      .page {
        position: relative;
        width: 100vw;
        min-height: 100dvh;
        padding-top: max(env(safe-area-inset-top), 0px);
        padding-bottom: calc(env(safe-area-inset-bottom) + 6vw);
        overflow: hidden;
      }

      /* 背景装饰: 3 个粉色块，模拟 Figma 的 Vector 5/6/7 */
      .bg-deco {
        position: absolute;
        pointer-events: none;
        background: #f2a4a2;
        border-radius: 50%;
        z-index: 0;
      }

      .bg-deco.d1 {
        top: calc(-3.96 * var(--unit));
        left: calc(45.23 * var(--unit));
        width: calc(66.6 * var(--unit));
        height: calc(71.25 * var(--unit));
        border-radius: 50% 50% 45% 55% / 60% 40% 60% 40%;
      }

      .bg-deco.d2 {
        top: calc(103.97 * var(--unit));
        left: calc(-32.42 * var(--unit));
        width: calc(114.72 * var(--unit));
        height: calc(120.5 * var(--unit));
        border-radius: 60% 40% 55% 45% / 50% 50% 50% 50%;
      }

      .bg-deco.d3 {
        top: calc(278 * var(--unit));
        left: calc(-1.74 * var(--unit));
        width: calc(145.57 * var(--unit));
        height: calc(144.7 * var(--unit));
        border-radius: 40% 60% 50% 50% / 50% 50% 60% 40%;
      }

      /* 内容容器 */
      .content {
        position: relative;
        z-index: 1;
        padding: 0 8.55vw;
        padding-top: 52.16vw;
      }

      /* 标题 */
      .title {
        font-size: 5.95vw;
        font-weight: 700;
        line-height: 1.35;
        color: #ffffff;
        margin-bottom: 9.5vw;
      }

      /* 头部装饰图（input-icon 位） */
      .header-illu {
        position: absolute;
        top: 25.4vw;
        left: 5.58vw;
        width: 35.44vw;
        height: 30.6vw;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .header-illu-icon {
        width: 85%;
        height: 80%;
        background-image: url('./html-icon.png');
        background-repeat: no-repeat;
        background-size: 700% 400%;
        background-position: 80% 45%;
      }

      /* 表单 */
      .form {
        display: flex;
        flex-direction: column;
        gap: 3vw;
      }

      .field {
        position: relative;
        width: 83.02vw;
        height: 8.92vw;
        background: #ffffff;
        border-radius: 4.46vw;
        display: flex;
        align-items: center;
        padding: 0 4.46vw;
        color: #d9d9d9;
        font-size: 2.98vw;
        font-weight: 700;
      }

      .field input {
        flex: 1;
        border: none;
        outline: none;
        background: transparent;
        color: #000000;
        font: inherit;
      }

      .field input::placeholder {
        color: #d9d9d9;
      }

      /* 第二行：验证码 + 获取按钮 */
      .row-2 {
        display: flex;
        align-items: center;
        gap: 0;
        width: 100%;
        position: relative;
      }

      .row-2 .code-field {
        flex: 1 1 0;
        min-width: 0; /* 让 flex shrink 真生效，否则 <input> 的 intrinsic min-width 会把容器撑超 */
        height: 8.92vw;
        background: #ffffff;
        border-radius: 4.46vw;
        display: flex;
        align-items: center;
        padding: 0 4.46vw;
        color: #d9d9d9;
        font-size: 2.98vw;
        font-weight: 700;
      }

      .row-2 .code-field input {
        flex: 1 1 0;
        min-width: 0;
        width: 100%;
        border: none;
        outline: none;
        background: transparent;
        color: #000000;
        font: inherit;
      }

      .row-2 .code-field input::placeholder {
        color: #d9d9d9;
      }

      .row-2 .get-btn {
        flex: 0 0 auto;
        /* 设计稿 807 → 100vw, 24px ≈ 2.97vw, 12px ≈ 1.49vw */
        height: 8.92vw;
        padding: 0 4vw;
        margin-right: 3vw;
        background: #ffe361;
        border: none;
        border-radius: 4.46vw;
        color: #000000;
        font-size: 2.98vw;
        font-weight: 700;
        white-space: nowrap;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .row-2 .get-btn.sending {
        padding: 0 1.8vw;
      }

      .row-2 .get-btn:active {
        transform: scale(0.98);
      }

      .row-2 .get-btn:disabled {
        background: #d9d9d9;
        cursor: not-allowed;
      }

      /* 分隔线 */
      .divider {
        width: 82.28vw;
        height: 0.25vw;
        background: #ffffff;
        margin: 2.73vw 0;
      }

      /* 查看照片按钮 */
      .view-photos {
        width: 83.02vw;
        height: 8.92vw;
        background: #ffffff;
        border: none;
        border-radius: 4.46vw;
        color: #000000;
        font-size: 2.98vw;
        font-weight: 700;
        letter-spacing: 0.2vw;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
      }

      .view-photos:active {
        transform: scale(0.98);
      }

      /* Toast 提示 */
      .toast {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0, 0, 0, 0.82);
        color: #ffffff;
        padding: 3vw 6vw;
        border-radius: 2vw;
        font-size: 3.5vw;
        font-weight: 500;
        line-height: 1.4;
        max-width: 80vw;
        text-align: center;
        z-index: 9999;
        opacity: 0;
        transition: opacity 0.18s ease;
        pointer-events: none;
        white-space: pre-line;
      }

      .toast.show {
        opacity: 1;
      }

      .toast.error {
        background: rgba(217, 48, 37, 0.92);
      }

      .toast.success {
        background: rgba(56, 161, 105, 0.92);
      }

      /* 发送中状态 */
      .get-btn.sending {
        background: #d9d9d9;
        cursor: wait;
      }

      /* 响应式微调 */
      @media (max-aspect-ratio: 9 / 16) {
        .title {
          font-size: 6.5vw;
        }
      }
    </style>
    <script>
      // 发送短信验证码接口 (POST JSON)
      const SMS_API = 'https://aiqc.hzyk.com.cn/promotion/api/sms/send'
      // 校验短信验证码接口 (POST JSON)
      const SMS_VERIFY_API = 'https://aiqc.hzyk.com.cn/promotion/api/sms/verify'
      // 业务成功判定: 后端返回 code === 200 (若后端用 0 改这里即可)
      const SMS_SUCCESS_CODES = new Set([200, 0])

      let countdown = 0
      let timer = null
      // 延迟到 DOM 就绪后再查 DOM, 避免 <head> 里同步执行时拿到 null
      function getEls() {
        return {
          phoneInput: document.getElementById('phone'),
          codeInput: document.getElementById('code'),
          getCodeBtn: document.getElementById('get-code'),
        }
      }

      // 兜底：吸收空格/全角/零宽/+86 等隐形字符，避免前端校验误判
      function normalizePhone(v) {
        return String(v || '')
          .replace(/[\s\u3000\u00A0\u200B-\u200D\uFEFF]/g, '')
          .replace(/^\+?86/, '')
      }
      function isValidPhone(v) {
        const phone = normalizePhone(v)
        // 务必保持 \d{9}（9 位数字），不要误写为 \d9
        return /^1[3-9]\d{9}$/.test(phone)
      }

      function showToast(msg, type) {
        let el = document.querySelector('.toast')
        if (!el) {
          el = document.createElement('div')
          el.className = 'toast'
          document.body.appendChild(el)
        }
        el.textContent = msg
        el.classList.remove('error', 'success', 'show')
        if (type) el.classList.add(type)
        void el.offsetWidth
        el.classList.add('show')
        clearTimeout(showToast._t)
        showToast._t = setTimeout(() => el.classList.remove('show'), 2200)
      }

      function startCountdown(sec, getCodeBtn) {
        countdown = sec
        getCodeBtn.disabled = true
        getCodeBtn.classList.add('sending')
        getCodeBtn.textContent = `发送中，${countdown}s后可重试`
        if (timer) clearInterval(timer)
        timer = setInterval(() => {
          countdown -= 1
          if (countdown <= 0) {
            clearInterval(timer)
            timer = null
            getCodeBtn.disabled = false
            getCodeBtn.classList.remove('sending')
            getCodeBtn.textContent = '获取验证码'
            return
          }
          getCodeBtn.textContent = `发送中，${countdown}s后可重试`
        }, 1000)
      }

      function cancelCountdown(getCodeBtn) {
        if (timer) {
          clearInterval(timer)
          timer = null
        }
        countdown = 0
        getCodeBtn.disabled = false
        getCodeBtn.classList.remove('sending')
        getCodeBtn.textContent = '获取验证码'
      }

      async function requestSmsApi(url, payload) {
        console.log('[SMS] →', url, payload)
        const res = await fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Accept: 'application/json',
          },
          body: JSON.stringify(payload),
        })
        const text = await res.text()
        let data = null
        try {
          data = text ? JSON.parse(text) : null
        } catch (e) {
          console.warn('[SMS] 非 JSON 响应', text)
        }
        console.log('[SMS] ←', res.status, data || text)
        return { ok: res.ok, status: res.status, data, raw: text }
      }

      async function handleGetCode() {
        if (countdown > 0) return
        const { phoneInput, getCodeBtn } = getEls()
        const phone = normalizePhone(phoneInput.value.trim())
        if (!isValidPhone(phone)) {
          phoneInput.focus()
          phoneInput.style.boxShadow = 'inset 0 0 0 0.3vw #ff4d4f'
          setTimeout(() => (phoneInput.style.boxShadow = ''), 1200)
          showToast('请输入正确的手机号', 'error')
          return
        }

        getCodeBtn.disabled = true
        getCodeBtn.classList.add('sending')
        getCodeBtn.textContent = '发送中…'

        try {
          const { ok, status, data } = await requestSmsApi(SMS_API, { phone })

          if (!ok) {
            cancelCountdown(getCodeBtn)
            showToast(`请求失败 (HTTP ${status})`, 'error')
            return
          }

          if (data && typeof data.code !== 'undefined' && !SMS_SUCCESS_CODES.has(data.code)) {
            startCountdown(60, getCodeBtn)
            showToast(data.message || '发送失败，请稍后重试', 'error')
            return
          }

          startCountdown(60, getCodeBtn)
          showToast(data?.message || '验证码已发送', 'success')
        } catch (err) {
          cancelCountdown(getCodeBtn)
          console.error('[SMS] error', err)
          const msg = (err && err.message) || '网络错误'
          showToast(`发送失败: ${msg}\n请检查网络或 CORS 配置`, 'error')
        }
      }

      async function handleSubmit(e) {
        e.preventDefault()
        const { phoneInput, codeInput } = getEls()
        const phone = normalizePhone(phoneInput.value.trim())
        const code = codeInput.value.trim()
        if (!isValidPhone(phone)) {
          phoneInput.focus()
          showToast('请输入正确的手机号', 'error')
          return false
        }
        if (!code) {
          codeInput.focus()
          showToast('请输入验证码', 'error')
          return false
        }

        const submitBtn = e.target.querySelector('.view-photos')
        const originalText = submitBtn ? submitBtn.textContent : ''
        if (submitBtn) {
          submitBtn.textContent = '校 验 中 …'
          submitBtn.style.pointerEvents = 'none'
        }

        try {
          const { ok, status, data } = await requestSmsApi(SMS_VERIFY_API, { phone, code })

          if (!ok) {
            showToast(`请求失败 (HTTP ${status})`, 'error')
            if (submitBtn) {
              submitBtn.textContent = originalText
              submitBtn.style.pointerEvents = ''
            }
            return false
          }

          const businessFailed =
            data && typeof data.code !== 'undefined' && !SMS_SUCCESS_CODES.has(data.code)
          if (businessFailed) {
            showToast(data.message || '请求失败', 'error')
            if (submitBtn) {
              submitBtn.textContent = originalText
              submitBtn.style.pointerEvents = ''
            }
            return false
          }

          const verified = data?.data?.verified === true
          if (!verified) {
            showToast(data?.message || '验证码错误', 'error')
            codeInput.focus()
            codeInput.select()
            if (submitBtn) {
              submitBtn.textContent = originalText
              submitBtn.style.pointerEvents = ''
            }
            return false
          }

          showToast(data?.message || '校验成功', 'success')
          if (submitBtn) {
            submitBtn.textContent = originalText
            submitBtn.style.pointerEvents = ''
          }
          try {
            sessionStorage.setItem('faceResult:verifyData', JSON.stringify(data))
          } catch (err) {
            console.warn('[SMS-VERIFY] sessionStorage 写入失败', err)
          }
          // 校验成功后、跳转前清空页面输入框，避免手机号/验证码在视觉上残留，
          // 且回退到本页时不会看到旧值。
          const { phoneInput: phoneEl, codeInput: codeEl } = getEls()
          if (phoneEl) {
            phoneEl.value = ''
            phoneEl.blur()
          }
          if (codeEl) {
            codeEl.value = ''
            codeEl.blur()
          }
          setTimeout(() => {
            location.href = 'face-result.html'
          }, 500)
          return false
        } catch (err) {
          console.error('[SMS-VERIFY] error', err)
          const msg = (err && err.message) || '网络错误'
          showToast(`校验失败: ${msg}\n请检查网络或 CORS 配置`, 'error')
          if (submitBtn) {
            submitBtn.textContent = originalText
            submitBtn.style.pointerEvents = ''
          }
        }
        return false
      }

      // 把函数挂到 window, 防止某些环境对 inline onclick 的作用域处理造成 undefined
      window.handleGetCode = handleGetCode
      window.handleSubmit = handleSubmit
    </script>
  </head>
  <body>
    <div class="page">
      <div class="bg-deco d1"></div>
      <div class="bg-deco d2"></div>
      <div class="bg-deco d3"></div>

      <div class="content">
        <div class="header-illu" aria-hidden="true">
          <span class="header-illu-icon"></span>
        </div>

        <h1 class="title">
          请输入您在拍摄时<br />
          预留的手机号
        </h1>

        <form class="form" id="form" onsubmit="return handleSubmit(event)">
          <div class="field">
            <input
              id="phone"
              type="tel"
              inputmode="numeric"
              maxlength="11"
              placeholder="输入手机号"
              autocomplete="tel"
            />
          </div>

          <div class="row-2">
            <button type="button" id="get-code" class="get-btn" onclick="handleGetCode()">
              获取验证码
            </button>
            <div class="code-field">
              <input
                id="code"
                type="text"
                inputmode="numeric"
                maxlength="6"
                size="1"
                placeholder="输入验证码"
                autocomplete="one-time-code"
              />
            </div>
          </div>

          <div class="divider"></div>

          <button type="submit" class="view-photos">查 看 照 片</button>
        </form>
      </div>
    </div>
  </body>
</html>
